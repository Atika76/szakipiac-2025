name: Targeted issue 8 backend deployment
on:
  workflow_dispatch:
    inputs:
      phase:
        description: 'A két alkalmazás jóváhagyott telepítési sorrendje szerint válassz lépést'
        required: true
        type: choice
        options: [migrate, functions]
      production_confirmation:
        description: 'Külön tulajdonosi jóváhagyás után írd be: DEPLOY_PRODUCTION'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: issue-8-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.production_confirmation == 'DEPLOY_PRODUCTION'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply only issue 8 migrations
        if: inputs.phase == 'migrate'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase link --project-ref bxtpnotswnwrbycvfypz
          supabase db query --linked --file supabase/migrations/202610180001_quote_workflow_stabilization.sql
          supabase db query --linked --file supabase/migrations/202610180002_project_save_retry.sql
          supabase db query --linked --file supabase/migrations/202610210001_building_draft_share_guard.sql
      - name: Deploy only the affected import functions
        if: inputs.phase == 'functions'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy send-quote-to-epitesnaplo --project-ref bxtpnotswnwrbycvfypz --use-api
