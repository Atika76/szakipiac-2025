name: Isolated two-app Supabase E2E
on:
  push:
    branches: ['codex/issue-8-stabilization']
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: supabase-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  supabase-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CI: 'true'
      SUPABASE_ACCESS_TOKEN: ''
      PEER_REPO: peer-naplo
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: Atika76/Epites-Naplo
          ref: 314d7ee24ac93299962ba3ec66584b2e51d68197
          path: peer-naplo
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: node tests/supabase-e2e.cjs
